# Layer configuration for meta-mts-openwrt

# Each layer needs a unique name to avoid conflicts
LAYERSERIES_COMPAT_meta-mts-openwrt = "kirkstone morty langdale"

# Define the layer path
BBPATH .= ":${LAYERDIR}"

# Add recipes to the BBFILES list
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
             ${LAYERDIR}/recipes-*/*/*.bbappend \
             ${LAYERDIR}/recipes-*/*/*.inc \
             ${LAYERDIR}/recipes-*/*/*.class \
             ${LAYERDIR}/recipes-*/*/*.ini \
             ${LAYERDIR}/recipes-*/*/*.py \
             ${LAYERDIR}/recipes-*/*/*.sh \
             ${LAYERDIR}/recipes-*/*/*.conf \
             ${LAYERDIR}/recipes-*/*/*.scc \
             ${LAYERDIR}/recipes-*/*/*.bin \
             ${LAYERDIR}/recipes-*/*/*.dtb \
             ${LAYERDIR}/recipes-*/*/*.dts \
             ${LAYERDIR}/recipes-*/*/*.mk \
             ${LAYERDIR}/recipes-*/*/*.txt \
             ${LAYERDIR}/recipes-*/*/*.cfg \
             ${LAYERDIR}/recipes-*/*/*.config"

BBFILE_COLLECTIONS += "meta-mts-openwrt"
BBFILE_PATTERN_meta-mts-openwrt = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mts-openwrt = "8"

# Include classes
INHERIT += "mts-openwrt"

# Machine configurations
require conf/machine/include/mts-common.inc

# Kernel configuration
KERNEL_EXTRA_ARGS = "LOADADDR=${KERNEL_LOADADDR}"

# Device tree configurations
DEVICE_TREE = "mts-${MACHINE}"

# OpenWrt specific settings
OPENWRT_TARGET = "mts-${MACHINE}"
OPENWRT_BOARD = "mediatek"

# Firmware paths
MTS_FIRMWARE_DIR = "/lib/firmware/mts"
MTS_DRIVER_DIR = "/lib/modules/${KERNEL_VERSION}/mts"

# Logging configuration
MTS_LOG_DIR = "/var/log/mts"
MTS_LOG_LEVEL = "info"

# Network configuration
MTS_MANAGEMENT_IFACE = "eth0"
MTS_MANAGEMENT_IP = "192.168.1.1"
MTS_MANAGEMENT_NETMASK = "255.255.255.0"
MTS_MANAGEMENT_GATEWAY = "192.168.1.254"
MTS_MANAGEMENT_DNS = "8.8.8.8,8.8.4.4"

# TR-069 configuration
MTS_CWMP_ENABLED = "1"
MTS_CWMP_INTERVAL = "3600"
MTS_CWMP_PORT = "7547"
MTS_CWMP_HTTPS_PORT = "443"
MTS_CWMP_MAX_CONNECTIONS = "10"

# API configuration
MTS_API_ENABLED = "1"
MTS_API_PORT = "50051"
MTS_API_TLS_ENABLED = "1"
MTS_API_MTLS_ENABLED = "1"

# Telemetry configuration
MTS_TELEMETRY_ENABLED = "1"
MTS_TELEMETRY_INTERVAL = "1000"
MTS_TELEMETRY_DELTA_ENCODING = "1"

# SD-WAN configuration (Enterprise)
MTS_SDWAN_ENABLED = "1"
MTS_SDWAN_CONTROLLER = "sdwan.mts-router.local"
MTS_SDWAN_PORT = "443"
MTS_SDWAN_TLS = "1"

# IPTV configuration (Residential)
MTS_IPTV_ENABLED = "1"
MTS_IPTV_PORT = "5004"
MTS_IPTV_PROTO = "igmp"
MTS_IPTV_MAX_SESSIONS = "8"

# VoIP configuration (Residential)
MTS_VOIP_ENABLED = "1"
MTS_VOIP_PROTOCOL = "sip"
MTS_VOIP_PORT = "5060"
MTS_VOIP_TLS_PORT = "5061"
MTS_VOIP_CODECS = "g711a,g711u,g729,g722"

# WiFi configuration (Residential)
MTS_WIFI_ENABLED = "1"
MTS_WIFI_2G_SSID = "MTS-Home-2G"
MTS_WIFI_5G_SSID = "MTS-Home-5G"
MTS_WIFI_2G_CHANNEL = "auto"
MTS_WIFI_5G_CHANNEL = "auto"
MTS_WIFI_2G_BANDWIDTH = "20/40"
MTS_WIFI_5G_BANDWIDTH = "20/40/80"
MTS_WIFI_2G_MODE = "bgn"
MTS_WIFI_5G_MODE = "a/n/ac/ax"
MTS_WIFI_SECURITY = "wpa3-sae"

# GPON configuration (OLT)
MTS_GPON_ENABLED = "1"
MTS_GPON_MAX_PORTS = "8"
MTS_GPON_MAX_ONU = "128"
MTS_GPON_TX_POWER_MIN = "-40"
MTS_GPON_TX_POWER_MAX = "60"
MTS_GPON_MTU = "1500"

# WDM configuration (OLT)
MTS_WDM_ENABLED = "1"
MTS_WDM_MAX_CHANNELS = "4"
MTS_WDM_MONITOR_INTERVAL = "1000"

# P4 Pipeline configuration (OLT)
MTS_P4_ENABLED = "1"
MTS_P4_PIPELINE_DIR = "/etc/mts/p4"
MTS_P4_DEFAULT_PIPELINE = "mts-gpon.p4info.pb"
