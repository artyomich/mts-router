# Layer configuration for meta-mts
# This layer provides board support for all MTS Router devices

# Declare the layer priority (higher = newer, takes precedence)
LAYERSERIES_COMPAT_meta-mts = "kirkstone langdale litho mickledot"
LAYERSERIES_CORENAMES_meta-mts = "kirkstone langdale litho mickledot"

# Add recipes paths
BBPATH .= ":${LAYERDIR}"

# Provide recipes
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Include configuration
CONFDIR .= "${LAYERDIR}/conf"

# Dependencies
LAYDEPENDS += "meta-openembedded/meta-filesystems \
               meta-openembedded/meta-networking \
               meta-openembedded/meta-python \
               meta-virtualization \
               k3s"

# Machine configurations
MACHINECONFDIR = "${LAYERDIR}/conf/machine"

# Classes
INHERIT += "mts-board"

# Image features
IMAGE_FSTYPES_DEFAULT_meta-mts = "ext4 wic.gz"

# Package managers
PACKAGE_CLASSES ?="package_rpm package_deb package-ipk"

# SDK configuration
SDKIMAGE_INSTALL_TASKS_append = " mts-api mts-sdk"
