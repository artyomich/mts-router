# MTS-ER-1000 Enterprise Router Machine Configuration
# NXP S32G3 ARM64 + TomTom switch
# OpenWrt-based embedded Linux

require conf/machine/include/arm32/uninext-arm32.inc

# Machine definition
MACHINE = "mts-er1000"
PREFERRED_PROVIDER_virtual/kernel = "linux-mts"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mts"

# CPU architecture
TARGET_ARCH = "arm"
TARGET_OS = "linux"
TUNE_ARCH = "arm"
TUNE_PKGARCH = "armv8a+crypto"

# Kernel machine type
KERNEL_MACHINE = "arm"

# Root filesystem
IMAGE_FSTYPES = "squashfs ext4 wic.gz"
IMAGE_ROOTFS_SIZE = "4194304"
IMAGE_ROOTFS_MAXSIZE = "8388608"
IMAGE_BOOT_FILES = "boot/vmlinuz boot/extlinux/extlinux.conf"

# Package manager
PACKAGE_CLASSES = "package_ipk"

# OpenWrt configuration
OPENWRT_SUPPORT = "1"
OPENWRT_VERSION = "23.05"
OPENWRT_TARGET = "arm/armv7"
OPENWRT_SUBTARGET = "nxp_s32g"

# Yocto version
PREFERRED_VERSION_linux ?= "6.1%"

# Kernel features
KERNEL_EXTRA_FEATURES = "features/kernel-hardening/kernel-hardening.kl.conf"

# Filesystem features
IMAGE_FEATURES += "ssh-server-opensysv package-management cmdline-utils"

# MTS board class override
MTS_BOARD_MODEL = "er1000"
MTS_BOARD_OS = "openwrt"
MTS_BOARD_VENDOR = "MTS Digital"

# Hardware specifics
CPUFLAGS = "-mcpu=cortex-a53+crc+crypto -mfpu=neon-fp-armv8 -mfloat-abi=hard -mfpu=neon-vfpv4"
CORE_IMAGE_BUILD_INSTALL_IMAGES = "1"

# S32G3 specific
S32G3_DRIVER = "1"
S32G3_SDK = "1"

# TomTom switch specific
TOMTOM_SWITCH = "1"
TOMTOM_DRIVER = "1"

# SD-WAN support
SDWAN_SUPPORT = "1"
SDWAN_ENGINE = "strongswan"
STRONGSWAN_VERSION = "6.0"

# BGP/MPLS support
BGP_SUPPORT = "1"
MPLS_SUPPORT = "1"
FRR_SUPPORT = "1"
FRR_VERSION = "9.0"

# IPSec support
IPSEC_SUPPORT = "1"
IPSEC_DAEMON = "strongswan"

# Timezone and locale
TIMEZONE = "UTC"
TIMEZONEARGS = ""
VARIANT ?= "default"
