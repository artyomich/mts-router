# MTS-OLT-2000 OLT GPON Machine Configuration
# Tofino 2 ASIC + AMD EPYC processor
# OpenWrt-based embedded Linux

require conf/machine/include/uninext-board.inc

# Machine definition
MACHINE = "mts-olt2000"
PREFERRED_PROVIDER_virtual/kernel = "linux-mts"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mts"

# CPU architecture
TARGET_ARCH = "x86-64"
TARGET_FPU = ""
TUNE_PKGARCH = "x86-64-v2"

# Kernel machine type
KERNEL_MACHINE = "x86_64"

# Root filesystem
IMAGE_FSTYPES = "squashfs ext4 wic.gz"
IMAGE_ROOTFS_SIZE = "6291456"
IMAGE_ROOTFS_MAXSIZE = "12582912"
IMAGE_BOOT_FILES = "boot/vmlinuz boot/extlinux/extlinux.conf"

# Package manager
PACKAGE_CLASSES = "package_ipk"

# OpenWrt configuration
OPENWRT_SUPPORT = "1"
OPENWRT_VERSION = "23.05"
OPENWRT_TARGET = "x86/64"
OPENWRT_SUBTARGET = "generic"

# Yocto version
PREFERRED_VERSION_linux ?= "6.6%"

# Kernel features
KERNEL_EXTRA_FEATURES = "features/kernel-hardening/kernel-hardening.kl.conf"

# Filesystem features
IMAGE_FEATURES += "ssh-server-opensysv package-management cmdline-utils"

# MTS board class override
MTS_BOARD_MODEL = "olt2000"
MTS_BOARD_OS = "openwrt"
MTS_BOARD_VENDOR = "MTS Digital"

# Hardware specifics
CPUFLAGS = "-march=x86-64-v2 -mtune=generic -mfpmath=sse -msse4.2"
CORE_IMAGE_BUILD_INSTALL_IMAGES = "1"

# Tofino 2 specific
TOFINO2_DRIVER = "1"
P4RUNTIME_SUPPORT = "1"

# GPON specific
GPON_SUPPORT = "1"
GPON_CHIP = "rtl960x"
RTL960X_DRIVER = "1"
OMCI_SUPPORT = "1"
TR069_SUPPORT = "1"
CWMPD_VERSION = "1.10"

# WiFi support (optional uplink)
WIFI_SUPPORT = "1"
WIFI_CHIP = "mt76"

# Timezone and locale
TIMEZONE = "UTC"
TIMEZONEARGS = ""
VARIANT ?= "default"
