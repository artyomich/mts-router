# MTS-RG-500 Residential Gateway Machine Configuration
# MediaTek MT7981 ARM64 + RTL960x GPON
# OpenWrt-based embedded Linux

require conf/machine/include/arm64/uninext-arm64.inc

# Machine definition
MACHINE = "mts-rg500"
PREFERRED_PROVIDER_virtual/kernel = "linux-mts"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mts"

# CPU architecture
TARGET_ARCH = "aarch64"
TARGET_OS = "linux"
TUNE_PKGARCH = "aarch64"

# Kernel machine type
KERNEL_MACHINE = "arm64"

# Root filesystem
IMAGE_FSTYPES = "ext4.gz wic.gz"
IMAGE_ROOTFS_SIZE = "2097152"
IMAGE_ROOTFS_MAXSIZE = "4194304"
IMAGE_BOOT_FILES = "boot/vmlinuz boot/extlinux/extlinux.conf"

# Package manager
PACKAGE_CLASSES = "package_ipk"

# OpenWrt configuration
OPENWRT_SUPPORT = "1"
OPENWRT_VERSION = "23.05"
OPENWRT_TARGET = "mediatek/mt7981"
OPENWRT_SUBTARGET = "mt7981"

# Yocto version
PREFERRED_VERSION_linux ?= "6.1%"

# Kernel features
KERNEL_EXTRA_FEATURES = "features/kernel-hardening/kernel-hardening.kl.conf"

# Filesystem features
IMAGE_FEATURES += "ssh-server-opensysv package-management cmdline-utils"

# MTS board class override
MTS_BOARD_MODEL = "rg500"
MTS_BOARD_OS = "openwrt"
MTS_BOARD_VENDOR = "MTS Digital"

# Hardware specifics
CPUFLAGS = "-mcpu=cortex-a72+crc+crypto -fpie -fPIE"
CORE_IMAGE_BUILD_INSTALL_IMAGES = "1"

# MT7981 specific
MT7981_DRIVER = "1"
MT7981_SDK = "1"
MT7981_ARCH = "armv8"

# RTL960x GPON specific
RTL960X_DRIVER = "1"
GPON_SUPPORT = "1"
OMCI_SUPPORT = "1"

# WiFi 6 support (MT76)
WIFI_SUPPORT = "1"
WIFI_CHIP = "mt76"
WIFI_STANDARD = "802.11ax"
WIFI_FREQ = "2.4GHz+5GHz"
MT76_FIRMWARE = "1"

# VoIP support
VOIP_SUPPORT = "1"
VOIP_DAEMON = "asterisk"
ASTERISK_VERSION = "21.0"
SIP_PROTOCOL = "pjsip"

# IPTV support
IPTV_SUPPORT = "1"
IGMP_PROXY = "1"
PPP_SUPPORT = "1"

# TR-069 support
TR069_SUPPORT = "1"
CWMPD_VERSION = "1.10"

# Timezone and locale
TIMEZONE = "UTC"
TIMEZONEARGS = ""
VARIANT ?= "default"
