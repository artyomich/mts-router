# MTS-MC-5000 Mobile Core Machine Configuration
# ThunderX3 ARM64 + AMD EPYC processor
# Yocto-based embedded Linux with K3s

require conf/machine/include/arm64/uninext-arm64.inc

# Machine definition
MACHINE = "mts-mc5000"
PREFERRED_PROVIDER_virtual/kernel = "linux-mts"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mts"

# CPU architecture
TARGET_ARCH = "aarch64"
TARGET_OS = "linux"
TUNE_AARCH64_CORE = "cortex-a76"
TUNE_PKGARCH = "aarch64"

# Kernel machine type
KERNEL_MACHINE = "arm64"

# Root filesystem
IMAGE_FSTYPES = "ext4 wic.gz"
IMAGE_ROOTFS_SIZE = "10485760"
IMAGE_ROOTFS_MAXSIZE = "20971520"
IMAGE_BOOT_FILES = "boot/vmlinuz boot/extlinux/extlinux.conf"

# Package manager
PACKAGE_CLASSES = "package_rpm package_deb"

# Yocto version
PREFERRED_VERSION_linux ?= "6.6%"

# Kernel features
KERNEL_EXTRA_FEATURES = "features/kernel-hardening/kernel-hardening.kl.conf features/virt/virt.kl.conf"

# Filesystem features
IMAGE_FEATURES += "ssh-server-opensysv package-management cmdline-utils sysfs-utils \
    dev-utils tools-debug tools-profile dmesg"

# K3s (Kubernetes) support
K3S_SUPPORT = "1"
K3S_VERSION = "1.28.0"
CONTAINER_RUNTIME = "containerd"
CNI_PLUGINS_VERSION = "1.4.0"

# DPDK support
PACKAGECONFIG_pn-qemu-native = "dpdk"
PACKAGECONFIG_pn-nativesdk-qemu = "dpdk"

# MTS board class override
MTS_BOARD_MODEL = "mc5000"
MTS_BOARD_OS = "yocto"
MTS_BOARD_VENDOR = "MTS Digital"

# Hardware specifics
CPUFLAGS = "-mcpu=cortex-a76+crc -fpie -fPIE"
CORE_IMAGE_BUILD_INSTALL_IMAGES = "1"

# ThunderX3 specific
THUNDERX3_DRIVER = "1"
UPF_SUPPORT = "1"
SMF_SUPPORT = "1"
AMF_SUPPORT = "1"
PCF_SUPPORT = "1"

# 5G specific
GTP_SUPPORT = "1"
PFCP_SUPPORT = "1"
SWA_SUPPORT = "1"

# Timezone and locale
TIMEZONE = "UTC"
TIMEZONEARGS = ""
VARIANT ?= "default"
