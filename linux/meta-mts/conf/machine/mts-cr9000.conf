# MTS-CR-9000 Core Router Machine Configuration
# Tofino 2 ASIC + AMD EPYC processor
# Yocto-based embedded Linux

DEFAULTTUNE = "x86-64"
MACHINE = "mts-cr9000"
PREFERRED_PROVIDER_virtual/kernel = "linux-mts"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mts"

# CPU architecture - TUNE_PKGARCH must match the PACKAGE_ARCH format
TUNE_PKGARCH = "x86_64"
TARGET_ARCH = "x86_64"
TARGET_FPU = ""

# Kernel machine type
KERNEL_MACHINE = "x86_64"

# Root filesystem
IMAGE_FSTYPES = "ext4 wic.gz"
IMAGE_ROOTFS_SIZE = "8388608"
IMAGE_ROOTFS_MAXSIZE = "16777216"
IMAGE_BOOT_FILES = "boot/vmlinuz boot/extlinux/extlinux.conf"

# Package manager
PACKAGE_CLASSES = "package_rpm package_deb"

# Yocto version
PREFERRED_VERSION_linux ?= "6.6%"

# Kernel features
KERNEL_EXTRA_FEATURES = "features/kernel-hardening/kernel-hardening.kl.conf features/virt/virt.kl.conf"

# Filesystem features
IMAGE_FEATURES += "ssh-server-opensysv package-management cmdline-utils sysfs-utils \
    dev-utils tools-debug tools-profile dmesg"

# DPDK support
PACKAGECONFIG_pn-qemu-native = "dpdk"
PACKAGECONFIG_pn-nativesdk-qemu = "dpdk"

# MTS board class override
MTS_BOARD_MODEL = "cr9000"
MTS_BOARD_OS = "yocto"
MTS_BOARD_VENDOR = "MTS Digital"

# Hardware specifics
CPUFLAGS = "-march=x86-64-v2 -mtune=generic -mfpmath=sse -msse4.2"
CORE_IMAGE_BUILD_INSTALL_IMAGES = "1"

# Tofino 2 specific
TOFINO2_DRIVER = "1"
P4RUNTIME_SUPPORT = "1"

# BGP/MPLS support
BGP_SUPPORT = "1"
MPLS_SUPPORT = "1"
SRV6_SUPPORT = "1"

# Timezone and locale
TIMEZONE = "UTC"
TIMEZONEARGS = ""
VARIANT ?= "default"
