# MTS-MB-3000 Mobile Backhaul Machine Configuration
# NXP S32G3 ARM64 + 88Q5242 switch
# Buildroot-based embedded Linux

require conf/machine/include/arm32/uninext-arm32.inc

# Machine definition
MACHINE = "mts-mb3000"
PREFERRED_PROVIDER_virtual/kernel = "linux-mts"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-mts"

# CPU architecture
TARGET_ARCH = "arm"
TARGET_OS = "linux"
TUNE_ARCH = "arm"
TUNE_MACHDEP = "fsl-layer"
TUNE_PKGARCH = "armv8a+crypto"

# Kernel machine type
KERNEL_MACHINE = "arm"

# Root filesystem
IMAGE_FSTYPES = "ext4.gz wic.gz"
IMAGE_ROOTFS_SIZE = "4194304"
IMAGE_ROOTFS_MAXSIZE = "8388608"
IMAGE_BOOT_FILES = "boot/vmlinuz boot/extlinux/extlinux.conf"

# Package manager
PACKAGE_CLASSES = "package_rpm package_deb package-ipk"

# Yocto version
PREFERRED_VERSION_linux ?= "6.1%"

# Kernel features
KERNEL_EXTRA_FEATURES = "features/kernel-hardening/kernel-hardening.kl.conf"

# Filesystem features
IMAGE_FEATURES += "ssh-server-opensysv package-management cmdline-utils"

# Buildroot configuration
BUILDROOT_SUPPORT = "1"
BUILDROOT_VERSION = "2024.02"
BUILDROOT_CONFIG = "board/mts/s32g3_defconfig"

# DPDK support
DPDK_SUPPORT = "1"
DPDK_VERSION = "23.11"
DPDK_TARGET = "x86_64-native"

# MTS board class override
MTS_BOARD_MODEL = "mb3000"
MTS_BOARD_OS = "buildroot"
MTS_BOARD_VENDOR = "MTS Digital"

# Hardware specifics
CPUFLAGS = "-mcpu=cortex-a53+crc+crypto -mfpu=neon-fp-armv8 -mfloat-abi=hard -mfpu=neon-vfpv4"
CORE_IMAGE_BUILD_INSTALL_IMAGES = "1"

# S32G3 specific
S32G3_DRIVER = "1"
S32G3_SDK = "1"

# MPLS-TP support
MPLS_TP_SUPPORT = "1"
MPLS_TP_VERSION = "1.0"

# PTP grandmaster
PTP_SUPPORT = "1"
PTP_DAEMON = "linuxptp"
PTP_VERSION = "4.0"

# SyncE support
SYNCE_SUPPORT = "1"

# Timezone and locale
TIMEZONE = "UTC"
TIMEZONEARGS = ""
VARIANT ?= "default"
