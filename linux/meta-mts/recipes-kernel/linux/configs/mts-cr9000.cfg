# ============================================================
# MTS-CR-9000 Core Router Kernel Configuration
# Tofino 2 ASIC + AMD EPYC processor
# ============================================================

# ============================================================
# x86_64 specific
# ============================================================
CONFIG_X86_64=y
CONFIG_X86_64_SMP=y
CONFIG_X86_GENERIC=y
CONFIG_X86_VSYSCALL_EMULATION=y
CONFIG_X86_IOPL_IOPERM=y
CONFIG_X86_MSR=y
CONFIG_X86_CPUID=y
CONFIG_X86_MCE=y
CONFIG_X86_MCE_INTEL=y
CONFIG_X86_MCE_AMD=y

# ============================================================
# PCIe/PCI for Tofino 2
# ============================================================
CONFIG_PCI=y
CONFIG_PCI_MMCONFIG=y
CONFIG_PCI_DOMAINS=y
CONFIG_PCI_DOMAINS_GENERIC=y
CONFIG_PCI_SYSCALL=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCIEAER=y
CONFIG_PCIEAER_INJECT=y
CONFIG_PCIEASPM=y
CONFIG_PCIEASPM_POWER_DEFAULT=y
CONFIG_PCIE_PME=y
CONFIG_PCI_MSI=y
CONFIG_PCI_MSIX=y
CONFIG_PCI_ATS=y
CONFIG_PCI_PRI=y
CONFIG_PCI_P2P=y
CONFIG_PCI_LABEL=y
CONFIG_PCI_STUB=y
CONFIG_PCI_VGA=y
CONFIG_PCI_HYPERV=y
CONFIG_INTEL_IOMMU=y
CONFIG_INTEL_IOMMU_SVM=y
CONFIG_INTEL_IOMMU_DEFAULT_ON=y
CONFIG_IOMMUFD=y
CONFIG_IO_STRICT_DEVMEM=y

# ============================================================
# Network device drivers for line cards
# ============================================================
CONFIG_NET_VENDOR_INTEL=y
CONFIG_E1000E=y
CONFIG_IGB=y
CONFIG_IXGBE=y
CONFIG_IXGBEVF=y
CONFIG_I40E=y
CONFIG_I40EVF=y
CONFIG_NET_VENDOR_BROADCOM=y
CONFIG_BNX2X=y
CONFIG_NET_VENDOR_CAVIUM=y
CONFIG_NET_VENDOR_MARVELL=y
CONFIG_SKGE=y
CONFIG_SKGE_GENESIS=y
CONFIG_SKGE_DEBUG=y
CONFIG_SKGE_NAPI=y
CONFIG_SKGE_GENESIS_NAPI=y
CONFIG_NET_VENDOR_MICROSEMI=y

# ============================================================
# Tofino 2 specific (custom driver)
# ============================================================
CONFIG_TOFINO2=y
CONFIG_TOFINO2_PCI=y
CONFIG_TOFINO2_P4=y
CONFIG_TOFINO2_BMC=y
CONFIG_TOFINO2_FW_LOAD=y
CONFIG_TOFINO2_SDE=y
