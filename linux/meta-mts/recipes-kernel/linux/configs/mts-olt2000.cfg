# ============================================================
# MTS-OLT-2000 OLT GPON Kernel Configuration
# Tofino 2 ASIC + AMD EPYC
# OpenWrt-based
# ============================================================

# ============================================================
# x86_64 specific
# ============================================================
CONFIG_X86_64=y
CONFIG_X86_64_SMP=y
CONFIG_X86_GENERIC=y
CONFIG_X86_VSYSCALL_EMULATION=y
CONFIG_X86_IOPL_IOPERM=y
CONFIG_X86_MSR=y
CONFIG_X86_CPUID=y
CONFIG_X86_MCE=y
CONFIG_X86_MCE_INTEL=y
CONFIG_X86_MCE_AMD=y

# ============================================================
# PCIe/PCI for Tofino 2 and RTL960x
# ============================================================
CONFIG_PCI=y
CONFIG_PCI_MMCONFIG=y
CONFIG_PCI_DOMAINS=y
CONFIG_PCI_DOMAINS_GENERIC=y
CONFIG_PCI_SYSCALL=y
CONFIG_PCIEPORTBUS=y
CONFIG_PCIEAER=y
CONFIG_PCIEASPM=y
CONFIG_PCIEASPM_POWER_DEFAULT=y
CONFIG_PCIE_PME=y
CONFIG_PCI_MSI=y
CONFIG_PCI_MSIX=y
CONFIG_PCI_ATS=y
CONFIG_PCI_PRI=y
CONFIG_PCI_P2P=y
CONFIG_PCI_LABEL=y
CONFIG_PCI_STUB=y
CONFIG_PCI_VGA=y
CONFIG_PCI_HYPERV=y
CONFIG_INTEL_IOMMU=y
CONFIG_INTEL_IOMMU_SVM=y
CONFIG_INTEL_IOMMU_DEFAULT_ON=y
CONFIG_IOMMUFD=y
CONFIG_IO_STRICT_DEVMEM=y

# ============================================================
# Network device drivers
# ============================================================
CONFIG_NET_VENDOR_INTEL=y
CONFIG_E1000E=y
CONFIG_IGB=y
CONFIG_IXGBE=y
CONFIG_IXGBEVF=y
CONFIG_I40E=y
CONFIG_I40EVF=y
CONFIG_NET_VENDOR_BROADCOM=y
CONFIG_BNX2X=y
CONFIG_NET_VENDOR_MARVELL=y
CONFIG_NET_VENDOR_MICROSEMI=y

# ============================================================
# Tofino 2 specific (custom driver)
# ============================================================
CONFIG_TOFINO2=y
CONFIG_TOFINO2_PCI=y
CONFIG_TOFINO2_P4=y
CONFIG_TOFINO2_BMC=y
CONFIG_TOFINO2_FW_LOAD=y
CONFIG_TOFINO2_SDE=y
CONFIG_TOFINO2_PIPE=y
CONFIG_TOFINO2_TABLE=y
CONFIG_TOFINO2_ACTION=y
CONFIG_TOFINO2_MATCH=y
CONFIG_TOFINO2_COUNTER=y
CONFIG_TOFINO2_METER=y
CONFIG_TOFINO2_REGISTER=y
CONFIG_TOFINO2_PARSER=y
CONFIG_TOFINO2_DEPARSER=y

# ============================================================
# RTL960x GPON specific
# ============================================================
CONFIG_RTL960X=y
CONFIG_RTL960X_PCI=y
CONFIG_RTL960X_GPON=y
CONFIG_RTL960X_GPON_ONU=y
CONFIG_RTL960X_GPON_ONT=y
CONFIG_RTL960X_GPON_MAC=y
CONFIG_RTL960X_GPON_PHY=y
CONFIG_RTL960X_GPON_OMCI=y
CONFIG_RTL960X_GPON_TR069=y
CONFIG_RTL960X_GPON_SN=y
CONFIG_RTL960X_GPON_BYPASS=y

# ============================================================
# OpenWrt/LuCI specific
# ============================================================
CONFIG_LUCI=y
CONFIG_LUCI_HTTP=y
CONFIG_LUCI_HTTPS=y
CONFIG_LUCI_SSL=y
CONFIG_LUCI_PROTO=y
CONFIG_LUCI_PROTO_UBUS=y
CONFIG_LUCI_PROTO_IPC=y
CONFIG_LUCI_PROTO_SOCKET=y
CONFIG_LUCI_PROTO_UNIX=y
CONFIG_LUCI_PROTO_TCP=y
CONFIG_LUCI_PROTO_UDP=y
CONFIG_LUCI_PROTO_TLS=y
CONFIG_LUCI_PROTO_DTLS=y
CONFIG_LUCI_PROTO_SSL=y
CONFIG_LUCI_PROTO_MBEDTLS=y
CONFIG_LUCI_PROTO_OPENSSL=y

# ============================================================
# Hugepages for DPDK (optional)
# ============================================================
CONFIG_HUGETLBFS=y
CONFIG_HUGETLB_PAGE=y
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y
CONFIG_DEF_HUGEPAGES=64
