# ============================================================
# MTS Base Kernel Configuration
# Common kernel options for all MTS Router devices
# ============================================================

# ============================================================
# General setup
# ============================================================
CONFIG_INIT_ENV_ARG_LIMIT=32
CONFIG_LOCALVERSION="-mts"
CONFIG_BUILD_SALT=y
CONFIG_SYSTEM_TRUSTED_KEYRING=y
CONFIG_DEFAULT_CA-BUNDLE trust

