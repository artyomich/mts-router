syntax = "proto3";

package mts.olt2000;

option cc_generic_services = false;

// ==================== OLT Status ====================
message OltStatus {
    string olt_id = 1;
    string status = 2; // active, inactive, error
    string firmware_version = 3;
    uint32 total_onu = 4;
    uint32 online_onu = 5;
    uint32 pon_ports = 6;
    uint64 rx_bytes = 7;
    uint64 tx_bytes = 8;
}

// ==================== PON Port ====================
message PonPortInfo {
    uint32 pon_id = 1;
    string name = 2;
    string status = 3;
    uint32 num_onu = 4;
    uint32 max_onu = 5;
    uint64 downstream_rate = 6;
    uint64 upstream_rate = 7;
    double downstream_util = 8;
    double upstream_util = 9;
    double optical_power = 10;
}

message PonPortInfoResponse {
    repeated PonPortInfo pon_ports = 1;
}

message PonPortStatus {
    uint32 port_id = 1;
    string status = 2; // up, down, error
    double rx_power = 3; // dBm
    double tx_power = 4; // dBm
    double temperature = 5; // celsius
    uint32 active_onu = 6;
    uint32 max_onu = 7;
}

// ==================== ONU ====================
message OnuInfo {
    string onu_id = 1;
    uint32 pon_port = 2;
    string status = 3; // online, offline, error, activating
    string serial_number = 4;
    string mac_address = 5;
    string firmware_version = 6;
    int32 power_level = 7; // dBm
    uint32 distance = 8; // meters
    uint32 vlan = 9;
    string qos_profile = 10;
    uint32 bandwidth_up_mbps = 11;
    uint32 bandwidth_down_mbps = 12;
    uint64 rx_bytes = 13;
    uint64 tx_bytes = 14;
}

// ==================== OMCI ====================
message OmciStatus {
    string status = 1; // active, inactive, error
    uint32 total_entities = 2;
    repeated OmciEntity entities = 3;
}

message OmciEntity {
    uint32 entity_id = 1;
    string name = 2;
    string type = 3; // onu, eth-port, pots-port, gpon-tn, vlan-tnp, multicast-set
    string status = 4; // active, inactive, testing
}

// ==================== TR-069 ====================
message Tr069Status {
    bool enabled = 1;
    string acs_url = 2;
    bool polling_enabled = 3;
    uint32 polling_interval = 4; // seconds
    string username = 5;
    string status = 6; // active, inactive, error
    string last_session_id = 7;
    int64 last_bootstrap = 8; // timestamp
}

// ==================== WDM ====================
message WdmChannel {
    uint32 channel_id = 1;
    uint64 center_frequency = 2; // Hz
    uint32 bandwidth = 3; // Hz
    string status = 4; // up, down
}

// ==================== Device Health ====================
message DeviceHealth {
    string device_id = 1;
    string model = 2;
    string firmware = 3;
    double cpu_usage = 4;
    double memory_usage = 5;
    double temperature = 6;
    string status = 7; // healthy, degraded, critical
}

// ==================== Service Responses ====================
message OltStatusResponse {
    OltStatus olt_status = 1;
    repeated PonPortStatus pon_ports = 2;
}

message OnuListResponse {
    repeated OnuInfo onus = 1;
}

message OnuListRequest {
    string pon_port = 1;
    string status_filter = 2;
}

message OnuStatusRequest {
    string onu_id = 1;
}

message OnuStatusResponse {
    OnuInfo status = 1;
}

message OnuResponse {
    OnuInfo onu = 1;
}

message SetOnuRequest {
    string onu_id = 1;
    uint32 pon_port = 2;
    uint32 vlan = 3;
    string qos_profile = 4;
    uint32 bandwidth_up_mbps = 5;
    uint32 bandwidth_down_mbps = 6;
}

message SetOnuResponse {
    bool success = 1;
    string message = 2;
}

message ResetOnuResponse {
    bool success = 1;
    string message = 2;
}

message UpdateOnuConfigRequest {
    string onu_id = 1;
    uint32 pon_port = 2;
    uint32 vlan = 3;
    string qos_profile = 4;
    uint32 bandwidth_up_mbps = 5;
    uint32 bandwidth_down_mbps = 6;
}

message UpdateOnuConfigResponse {
    bool success = 1;
    string message = 2;
}

message OmciStatusResponse {
    OmciStatus omci_status = 1;
}

message Tr069Config {
    bool enabled = 1;
    string acs_url = 2;
    bool polling_enabled = 3;
    uint32 polling_interval = 4;
    string username = 5;
    string password = 6;
    uint32 last_session_id = 7;
    int64 last_bootstrap = 8;
}

message Tr069ConfigRequest {
    bool enabled = 1;
    string acs_url = 2;
    bool polling_enabled = 3;
    uint32 polling_interval = 4;
    string username = 5;
    string password = 6;
}

message Tr069ConfigResponse {
    Tr069Config config = 1;
}

message WdmStatusResponse {
    repeated WdmChannel channels = 1;
}

message DeviceHealthResponse {
    DeviceHealth health = 1;
}

// ==================== Service Definition ====================
service OltGponService {
    // OLT status
    rpc GetOltStatus(Empty) returns (OltStatusResponse);
    
    // ONU management
    rpc ListOnus(Empty) returns (OnuListResponse);
    rpc GetOnu(OnuIdRequest) returns (OnuResponse);
    rpc SetOnu(SetOnuRequest) returns (SetOnuResponse);
    rpc ResetOnu(OnuIdRequest) returns (ResetOnuResponse);
    rpc UpdateOnuConfig(UpdateOnuConfigRequest) returns (UpdateOnuConfigResponse);
    
    // OMCI
    rpc GetOmciStatus(Empty) returns (OmciStatusResponse);
    
    // TR-069
    rpc GetTr069Config(Empty) returns (Tr069ConfigResponse);
    rpc SetTr069Config(Tr069ConfigRequest) returns (Tr069ConfigResponse);
    
    // WDM
    rpc GetWdmStatus(Empty) returns (WdmStatusResponse);
    
    // Health
    rpc GetHealth(Empty) returns (DeviceHealthResponse);
    
    // Health check (gRPC standard)
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ==================== Messages ====================
message Empty {}

message OnuIdRequest {
    string onu_id = 1;
}

message HealthCheckRequest {
    string service = 1;
}

message HealthCheckResponse {
    enum ServingStatus {
        UNKNOWN = 0;
        SERVING = 1;
        NOT_SERVING = 2;
        SERVICE_UNKNOWN = 3;
    }
    ServingStatus status = 1;
}

message TelemetrySubscription {
    repeated string paths = 1;
    int64 sample_interval = 2;
}

message TelemetryData {
    int64 timestamp = 1;
    map<string, double> metrics = 2;
    repeated PortStats ports = 3;
}

message PortStats {
    string name = 1;
    uint64 rx_bytes = 2;
    uint64 tx_bytes = 3;
    uint64 rx_packets = 4;
    uint64 tx_packets = 5;
    uint64 rx_errors = 6;
    uint64 tx_errors = 7;
}
