syntax = "proto3";

package mts.residential.gateway.v1;

option cc_generic_services = false;

// ============================================================
// WiFi Messages
// ============================================================

// WiFi AP configuration
message WifiApConfig {
    uint32 band = 1; // 2.4GHz=2, 5GHz=5
    string ssid = 2;
    string channel = 3;
    string mode = 4; // bgn, a/n/ac/ax
    string bandwidth = 5; // 20/40, 20/40/80
    string security = 6; // wpa3-sae, wpa2-psk, open
    string psk = 7;
    bool hidden_ssid = 8;
    bool guest_network = 9;
    uint32 max_clients = 10;
    uint32 connected_clients = 11;
    uint64 tx_bytes = 12;
    uint64 rx_bytes = 13;
    double signal_strength = 14;
    double interference = 15;
}

// WiFi client info
message WifiClient {
    uint32 client_id = 1;
    string mac_address = 2;
    string ssid = 3;
    uint32 band = 4;
    string signal_strength = 5;
    uint32 data_rate_mbps = 6;
    uint64 tx_bytes = 7;
    uint64 rx_bytes = 8;
    int64 connected_at = 9;
    string ip_address = 10;
}

// ============================================================
// VoIP Messages
// ============================================================

// VoIP account configuration
message VoipAccount {
    uint32 account_id = 1;
    string username = 2;
    string display_name = 3;
    string registrar = 4;
    string auth_username = 5;
    string auth_password = 6;
    string transport = 7; // udp, tcp, tls
    uint32 port = 8;
    string codec = 9; // g711a, g711u, g729, g722
    bool enabled = 10;
    string status = 11; // registered, unavailable, error
    uint32 reregister_interval = 12;
}

// VoIP call status
message VoipCall {
    uint32 call_id = 1;
    string caller = 2;
    string callee = 3;
    string status = 4; // dialing, ringing, active, held, ended
    int64 started_at = 5;
    int64 duration_seconds = 6;
    string codec = 7;
    double jitter_ms = 8;
    double packet_loss_pct = 9;
    double mos_score = 10;
}

// ============================================================
// IPTV Messages
// ============================================================

// IPTV channel
message IptvChannel {
    uint32 channel_id = 1;
    string name = 2;
    uint32 number = 3;
    string video_codec = 4; // h264, h265
    uint32 resolution = 5; // 720, 1080, 4k
    uint32 fps = 6;
    string audio_codec = 7; // aac, mp2
    string epg_id = 8;
    uint64 viewers = 9;
}

// IPTV session
message IptvSession {
    uint32 session_id = 1;
    string mac_address = 2;
    string ip_address = 3;
    uint32 channel_id = 4;
    string status = 5; // active, inactive
    uint64 rx_bytes = 6;
    uint64 tx_bytes = 7;
    int64 started_at = 8;
}

// ============================================================
// TR-069 Messages
// ============================================================

// TR-069 status
message Tr069Status {
    string status = 1; // active, inactive, error
    string acs_url = 2;
    uint32 acs_port = 3;
    uint32 connection_requests = 4;
    uint32 max_connections = 5;
    uint32 active_sessions = 6;
    int64 last_connection = 7;
    int64 next_connection = 8;
}

// Firmware status
message FirmwareStatus {
    string firmware_url = 1;
    string file_name = 2;
    uint64 file_size = 3;
    string file_type = 4;
    string version = 5;
    string status = 6; // downloading, downloading, verifying, installing, installed, failed
    double progress_pct = 7;
    int64 started_at = 8;
    int64 completed_at = 9;
}

// ============================================================
// Device Health Messages
// ============================================================

// Device health for residential gateway
message DeviceHealth {
    string device_id = 1;
    string model = 2;
    string firmware = 3;
    double cpu_usage = 4;
    double memory_usage = 5;
    double temperature = 6;
    string status = 7; // healthy, degraded, critical
    uint64 uptime_seconds = 8;
    uint64 packet_loss_pct = 9;
    double latency_ms = 10;
    uint64 wan_rx_bytes = 11;
    uint64 wan_tx_bytes = 12;
    uint64 lan_rx_bytes = 13;
    uint64 lan_tx_bytes = 14;
    uint64 wifi_rx_bytes = 15;
    uint64 wifi_tx_bytes = 16;
}

// ============================================================
// Responses
// ============================================================

message WifiApConfigResponse {
    repeated WifiApConfig aps = 1;
}

message WifiClientResponse {
    repeated WifiClient clients = 1;
}

message VoipAccountResponse {
    repeated VoipAccount accounts = 1;
}

message VoipCallResponse {
    repeated VoipCall calls = 1;
}

message IptvChannelResponse {
    repeated IptvChannel channels = 1;
}

message IptvSessionResponse {
    repeated IptvSession sessions = 1;
}

message Tr069StatusResponse {
    Tr069Status status = 1;
}

message FirmwareStatusResponse {
    FirmwareStatus firmware = 1;
}

message DeviceHealthResponse {
    DeviceHealth health = 1;
}

// ============================================================
// Service Definition
// ============================================================

service MtsResidentialGateway {
    // WiFi management
    rpc GetWifiConfigs(GetWifiConfigsRequest) returns (WifiApConfigResponse);
    rpc SetWifiConfig(WifiApConfig) returns (SetConfigResponse);
    rpc GetWifiClients(GetWifiClientsRequest) returns (WifiClientResponse);
    
    // VoIP management
    rpc GetVoipAccounts(GetVoipAccountsRequest) returns (VoipAccountResponse);
    rpc SetVoipAccount(VoipAccount) returns (SetConfigResponse);
    rpc DeleteVoipAccount(DeleteVoipAccountRequest) returns (DeleteResponse);
    rpc GetVoipCalls(GetVoipCallsRequest) returns (VoipCallResponse);
    
    // IPTV management
    rpc GetIptvChannels(GetIptvChannelsRequest) returns (IptvChannelResponse);
    rpc GetIptvSessions(GetIptvSessionsRequest) returns (IptvSessionResponse);
    rpc StartIptvSession(IptvSessionConfig) returns (IptvSessionConfigResponse);
    rpc StopIptvSession(StopIptvSessionRequest) returns (DeleteResponse);
    
    // TR-069 management
    rpc GetTr069Status(GetTr069StatusRequest) returns (Tr069StatusResponse);
    rpc SetTr069Config(Tr069Config) returns (SetConfigResponse);
    rpc GetFirmwareStatus(GetFirmwareStatusRequest) returns (FirmwareStatusResponse);
    rpc TriggerFirmwareDownload(FirmwareDownloadRequest) returns (FirmwareDownloadResponse);
    
    // Device health
    rpc GetDeviceHealth(GetDeviceHealthRequest) returns (DeviceHealthResponse);
    
    // Telemetry streaming
    rpc StreamHealth(stream GetDeviceHealthRequest) returns (stream DeviceHealthResponse);
}

// ============================================================
// Request Messages
// ============================================================

message GetWifiConfigsRequest {
    uint32 band = 1;
    bool all = 2;
}

message GetWifiClientsRequest {
    uint32 band = 1;
    bool all = 2;
}

message SetConfigResponse {
    bool success = 1;
    string message = 2;
}

message GetVoipAccountsRequest {
    uint32 account_id = 1;
    bool all = 2;
}

message DeleteVoipAccountRequest {
    uint32 account_id = 1;
}

message GetVoipCallsRequest {
    uint32 call_id = 1;
    bool all = 2;
}

message GetIptvChannelsRequest {
    uint32 channel_id = 1;
    bool all = 2;
}

message GetIptvSessionsRequest {
    bool all = 1;
}

message IptvSessionConfig {
    uint32 session_id = 1;
    string mac_address = 2;
    uint32 channel_id = 3;
}

message IptvSessionConfigResponse {
    bool success = 1;
    string message = 2;
}

message StopIptvSessionRequest {
    uint32 session_id = 1;
}

message GetTr069StatusRequest {
    bool all = 1;
}

message Tr069Config {
    string acs_url = 1;
    uint32 acs_port = 2;
    string username = 3;
    string password = 4;
    uint32 periodic_interval = 5;
    bool periodic_enabled = 6;
}

message GetFirmwareStatusRequest {
    bool all = 1;
}

message FirmwareDownloadRequest {
    string url = 1;
    string file_type = 2;
}

message FirmwareDownloadResponse {
    bool success = 1;
    string message = 2;
}

message GetDeviceHealthRequest {
    string device_id = 1;
}

message DeleteResponse {
    bool success = 1;
    string message = 2;
}
