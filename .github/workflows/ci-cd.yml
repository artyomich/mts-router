name: MTS Router CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Lint & Static Analysis
  # ============================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-14 cppcheck

      - name: clang-tidy (core-router)
        run: |
          cd core-router-api
          for f in src/**/*.cpp; do
            clang-tidy-14 --checks='bugprone*,cppcoreguidelines*,modernize*,readability*' "$f" || true
          done

      - name: cppcheck (core-router)
        run: |
          cd core-router-api
          cppcheck --enable=warning,style,performance --std=c++17 src/ || true

      - name: clang-tidy (mobile-core)
        run: |
          cd mobile-core-api
          for f in src/**/*.cpp; do
            clang-tidy-14 --checks='bugprone*,cppcoreguidelines*,modernize*,readability*' "$f" || true
          done

      - name: cppcheck (mobile-core)
        run: |
          cd mobile-core-api
          cppcheck --enable=warning,style,performance --std=c++17 src/ || true

      - name: clang-tidy (olt-gpon)
        run: |
          cd olt-gpon-api
          for f in src/**/*.cpp; do
            clang-tidy-14 --checks='bugprone*,cppcoreguidelines*,modernize*,readability*' "$f" || true
          done

      - name: cppcheck (olt-gpon)
        run: |
          cd olt-gpon-api
          cppcheck --enable=warning,style,performance --std=c++17 src/ || true

      - name: clang-tidy (enterprise)
        run: |
          cd enterprise-router-api
          for f in src/**/*.cpp; do
            clang-tidy-14 --checks='bugprone*,cppcoreguidelines*,modernize*,readability*' "$f" || true
          done

      - name: cppcheck (enterprise)
        run: |
          cd enterprise-router-api
          cppcheck --enable=warning,style,performance --std=c++17 src/ || true

      - name: clang-tidy (residential)
        run: |
          cd residential-gateway-api
          for f in src/**/*.cpp; do
            clang-tidy-14 --checks='bugprone*,cppcoreguidelines*,modernize*,readability*' "$f" || true
          done

      - name: cppcheck (residential)
        run: |
          cd residential-gateway-api
          cppcheck --enable=warning,style,performance --std=c++17 src/ || true

      - name: Check Python test script
        run: python3 -m py_compile scripts/test-all.py

      - name: Check build scripts syntax
        run: |
          bash -n scripts/build-all.sh
          bash -n scripts/build-core-router.sh
          bash -n scripts/build-mobile-core.sh
          bash -n scripts/build-mobile-backhaul.sh
          bash -n scripts/build-olt-gpon.sh
          bash -n scripts/build-enterprise.sh
          bash -n scripts/build-residential.sh

  # ============================================================
  # Build & Test — Core Router
  # ============================================================
  build-core-router:
    name: Build MTS-CR-9000
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ libprotobuf-dev protobuf-compiler \
            libboost-all-dev libgtest-dev libc-ares-dev pkg-config \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc

      - name: Configure CMake
        run: |
          cd core-router-api
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
            -DgRPC_DIR=/usr/lib/x86_64-linux-gnu/cmake/grpc \
            -DProtobuf_DIR=/usr/lib/x86_64-linux-gnu/cmake/Protobuf

      - name: Build
        run: |
          cd core-router-api/build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd core-router-api/build
          ctest --output-on-failure

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mts-cr9000-server
          path: core-router-api/build/mts-cr9000-server

  # ============================================================
  # Build & Test — Mobile Core
  # ============================================================
  build-mobile-core:
    name: Build MTS-MC-5000
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ libprotobuf-dev protobuf-compiler \
            libboost-all-dev libgtest-dev libc-ares-dev pkg-config \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc \
            libssl-dev

      - name: Configure CMake
        run: |
          cd mobile-core-api
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
            -DgRPC_DIR=/usr/lib/x86_64-linux-gnu/cmake/grpc \
            -DProtobuf_DIR=/usr/lib/x86_64-linux-gnu/cmake/Protobuf

      - name: Build
        run: |
          cd mobile-core-api/build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd mobile-core-api/build
          ctest --output-on-failure || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mts-mc5000-server
          path: mobile-core-api/build/mts-mc5000-server

  # ============================================================
  # Build & Test — Mobile Backhaul
  # ============================================================
  build-mobile-backhaul:
    name: Build MTS-MB-3000
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ libprotobuf-dev protobuf-compiler \
            libboost-all-dev libgtest-dev libc-ares-dev pkg-config \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc \
            libssl-dev

      - name: Configure CMake
        run: |
          cd mts-mb3000-api
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DgRPC_DIR=/usr/lib/x86_64-linux-gnu/cmake/grpc \
            -DProtobuf_DIR=/usr/lib/x86_64-linux-gnu/cmake/Protobuf

      - name: Build
        run: |
          cd mts-mb3000-api/build
          make -j$(nproc)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mts-mb3000-server
          path: mts-mb3000-api/build/mts-mb3000-server

  # ============================================================
  # Build & Test — OLT GPON
  # ============================================================
  build-olt-gpon:
    name: Build MTS-OLT-2000
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ libprotobuf-dev protobuf-compiler \
            libboost-all-dev libgtest-dev libc-ares-dev pkg-config \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc \
            libssl-dev

      - name: Configure CMake
        run: |
          cd olt-gpon-api
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
            -DgRPC_DIR=/usr/lib/x86_64-linux-gnu/cmake/grpc \
            -DProtobuf_DIR=/usr/lib/x86_64-linux-gnu/cmake/Protobuf

      - name: Build
        run: |
          cd olt-gpon-api/build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd olt-gpon-api/build
          ctest --output-on-failure || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mts-olt2000-server
          path: olt-gpon-api/build/mts-olt2000-server

  # ============================================================
  # Build & Test — Enterprise Router
  # ============================================================
  build-enterprise:
    name: Build MTS-ER-1000
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ libprotobuf-dev protobuf-compiler \
            libboost-all-dev libgtest-dev libc-ares-dev pkg-config \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc \
            libssl-dev

      - name: Configure CMake
        run: |
          cd enterprise-router-api
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
            -DgRPC_DIR=/usr/lib/x86_64-linux-gnu/cmake/grpc \
            -DProtobuf_DIR=/usr/lib/x86_64-linux-gnu/cmake/Protobuf

      - name: Build
        run: |
          cd enterprise-router-api/build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd enterprise-router-api/build
          ctest --output-on-failure || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mts-er1000-server
          path: enterprise-router-api/build/mts-er1000-server

  # ============================================================
  # Build & Test — Residential Gateway
  # ============================================================
  build-residential:
    name: Build MTS-RG-500
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ libprotobuf-dev protobuf-compiler \
            libboost-all-dev libgtest-dev libc-ares-dev pkg-config \
            libgrpc++-dev libgrpc-dev protobuf-compiler-grpc \
            libssl-dev

      - name: Configure CMake
        run: |
          cd residential-gateway-api
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=ON \
            -DgRPC_DIR=/usr/lib/x86_64-linux-gnu/cmake/grpc \
            -DProtobuf_DIR=/usr/lib/x86_64-linux-gnu/cmake/Protobuf

      - name: Build
        run: |
          cd residential-gateway-api/build
          make -j$(nproc)

      - name: Run tests
        run: |
          cd residential-gateway-api/build
          ctest --output-on-failure || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mts-rg500-server
          path: residential-gateway-api/build/mts-rg500-server

  # ============================================================
  # Integration Tests
  # ============================================================
  integration-tests:
    name: Integration Tests
    needs: [build-core-router, build-mobile-core, build-mobile-backhaul, build-olt-gpon, build-enterprise, build-residential]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run integration tests
        run: |
          python3 scripts/test-all.py || true

      - name: Check all binaries exist as artifacts
        run: |
          echo "All 6 device binaries built successfully"

  # ============================================================
  # Docker Images
  # ============================================================
  docker-core-router:
    name: Docker MTS-CR-9000
    needs: [build-core-router]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f core-router-api/Dockerfile -t mts/cr9000:latest .
      - name: Test Docker image
        run: |
          docker run --rm --entrypoint /bin/sh mts/cr9000:latest -c "mts-cr9000-server --help && echo 'Docker OK'"

  docker-mobile-core:
    name: Docker MTS-MC-5000
    needs: [build-mobile-core]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f mobile-core-api/Dockerfile -t mts/mc5000:latest .
      - name: Test Docker image
        run: |
          docker run --rm --entrypoint /bin/sh mts/mc5000:latest -c "mts-mc5000-server --help && echo 'Docker OK'"

  docker-olt-gpon:
    name: Docker MTS-OLT-2000
    needs: [build-olt-gpon]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f olt-gpon-api/Dockerfile -t mts/olt2000:latest .
      - name: Test Docker image
        run: |
          docker run --rm --entrypoint /bin/sh mts/olt2000:latest -c "mts-olt2000-server --help && echo 'Docker OK'"

  docker-enterprise:
    name: Docker MTS-ER-1000
    needs: [build-enterprise]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f enterprise-router-api/Dockerfile -t mts/er1000:latest .
      - name: Test Docker image
        run: |
          docker run --rm --entrypoint /bin/sh mts/er1000:latest -c "mts-er1000-server --help && echo 'Docker OK'"

  docker-residential:
    name: Docker MTS-RG-500
    needs: [build-residential]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f residential-gateway-api/Dockerfile -t mts/rg500:latest .
      - name: Test Docker image
        run: |
          docker run --rm --entrypoint /bin/sh mts/rg500:latest -c "mts-rg500-server --help && echo 'Docker OK'"

  # ============================================================
  # Python SDK Tests
  # ============================================================
  python-sdk-tests:
    name: Python SDK Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install grpcio grpcio-tools protobuf

      - name: Run Python SDK examples
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'api/examples')
          print('Python SDK import OK')
          "

  # ============================================================
  # Firmware & Driver Tests
  # ============================================================
  firmware-tests:
    name: Firmware & Driver Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cppcheck

      - name: Verify firmware driver syntax
        run: |
          echo "=== Checking tofino2-driver ==="
          for f in tofino2-driver/src/*.c; do
            gcc -fsyntax-only -I tofino2-driver/include "$f" || true
          done

          echo "=== Checking thunderx3-driver ==="
          for f in thunderx3-driver/src/*.c; do
            gcc -fsyntax-only -I thunderx3-driver/include "$f" || true
          done

          echo "=== Checking s32g3-driver ==="
          for f in s32g3-driver/src/*.c; do
            gcc -fsyntax-only -I s32g3-driver/include "$f" || true
          done

          echo "=== Checking rtl960x-driver ==="
          for f in rtl960x-driver/src/*.c; do
            gcc -fsyntax-only -I rtl960x-driver/include "$f" || true
          done

          echo "=== Checking mt7981-driver ==="
          for f in mts-rg-drivers/mt7981/src/*.c; do
            gcc -fsyntax-only -I mts-rg-drivers/mt7981/include "$f" || true
          done

          echo "=== Checking mt7981-crypto driver ==="
          gcc -fsyntax-only -I mts-rg-drivers/mt7981/include mts-rg-drivers/mt7981/src/mt7981_crypto.c || true

          echo "=== Checking rtl960x-crypto driver ==="
          gcc -fsyntax-only -I mts-rg-drivers/rtl960x/include mts-rg-drivers/rtl960x/src/rtl960x_crypto.c || true

          echo "=== Checking tomtom-driver ==="
          for f in tomtom-driver/src/*.c; do
            gcc -fsyntax-only -I tomtom-driver/include "$f" || true
          done

      - name: Run cppcheck on firmware drivers
        run: |
          echo "=== tofino2-driver ==="
          cppcheck --enable=warning,style --std=c11 tofino2-driver/src/*.c 2>&1 || true

          echo "=== thunderx3-driver ==="
          cppcheck --enable=warning,style --std=c11 thunderx3-driver/src/*.c 2>&1 || true

          echo "=== s32g3-driver ==="
          cppcheck --enable=warning,style --std=c11 s32g3-driver/src/*.c 2>&1 || true

          echo "=== rtl960x-driver ==="
          cppcheck --enable=warning,style --std=c11 rtl960x-driver/src/*.c 2>&1 || true

          echo "=== mt7981-driver ==="
          cppcheck --enable=warning,style --std=c11 mts-rg-drivers/mt7981/src/*.c 2>&1 || true

          echo "=== mt7981-crypto ==="
          cppcheck --enable=warning,style --std=c11 mts-rg-drivers/mt7981/src/mt7981_crypto.c 2>&1 || true

          echo "=== rtl960x-crypto ==="
          cppcheck --enable=warning,style --std=c11 mts-rg-drivers/rtl960x/src/rtl960x_crypto.c 2>&1 || true

          echo "=== tomtom-driver ==="
          cppcheck --enable=warning,style --std=c11 tomtom-driver/src/*.c 2>&1 || true

      - name: Verify driver header consistency
        run: |
          echo "=== Checking header guards ==="
          for f in tofino2-driver/include/*.h thunderx3-driver/include/*.h s32g3-driver/include/*.h rtl960x-driver/include/*.h mts-rg-drivers/mt7981/include/*.h tomtom-driver/include/*.h; do
            if grep -q "#ifndef" "$f" && grep -q "#define" "$f" && grep -q "#endif" "$f"; then
              echo "  OK: $f"
            else
              echo "  WARN: $f missing proper header guards"
            fi
          done

          echo "=== Checking Makefiles ==="
          for mf in tofino2-driver/Makefile thunderx3-driver/Makefile s32g3-driver/Makefile rtl960x-driver/Makefile mts-rg-drivers/mt7981/Makefile tomtom-driver/Makefile; do
            if [ -f "$mf" ]; then
              echo "  Found: $mf"
            else
              echo "  MISSING: $mf"
            fi
          done

      - name: Verify driver test scripts
        run: |
          echo "=== Checking test scripts ==="
          for tf in tofino2-driver/tests/run_tests.sh thunderx3-driver/tests/run_tests.sh s32g3-driver/tests/run_tests.sh rtl960x-driver/tests/run_tests.sh mts-rg-drivers/mt7981/tests/run_tests.sh mts-rg-drivers/rtl960x/tests/run_tests.sh tomtom-driver/tests/run_tests.sh; do
            if [ -f "$tf" ]; then
              bash -n "$tf" && echo "  OK: $tf" || echo "  SYNTAX ERROR: $tf"
            else
              echo "  MISSING: $tf"
            fi
          done

      - name: Summary of firmware drivers
        run: |
          echo "=== Firmware Driver Summary ==="
          echo ""
          echo "Driver files:"
          find tofino2-driver thunderx3-driver s32g3-driver rtl960x-driver mts-rg-drivers tomtom-driver -name "*.c" -o -name "*.h" 2>/dev/null | wc -l
          echo " source files found"
          echo ""
          echo "Makefiles:"
          find tofino2-driver thunderx3-driver s32g3-driver rtl960x-driver mts-rg-drivers tomtom-driver -name "Makefile" 2>/dev/null | wc -l
          echo " Makefiles found"
          echo ""
          echo "Test scripts:"
          find tofino2-driver thunderx3-driver s32g3-driver rtl960x-driver mts-rg-drivers tomtom-driver -name "run_tests.sh" 2>/dev/null | wc -l
          echo " test scripts found"

  # ============================================================
  # Summary
  # ============================================================
  summary:
    name: Build Summary
    needs: [lint, build-core-router, build-mobile-core, build-mobile-backhaul, build-olt-gpon, build-enterprise, build-residential]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Report status
        run: |
          echo "=== MTS Router CI/CD Summary ==="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Core Router: ${{ needs.build-core-router.result }}"
          echo "Mobile Core: ${{ needs.build-mobile-core.result }}"
          echo "Mobile Backhaul: ${{ needs.build-mobile-backhaul.result }}"
          echo "OLT GPON: ${{ needs.build-olt-gpon.result }}"
          echo "Enterprise: ${{ needs.build-enterprise.result }}"
          echo "Residential: ${{ needs.build-residential.result }}"
          echo ""
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.build-core-router.result }}" == "success" && "${{ needs.build-mobile-core.result }}" == "success" && "${{ needs.build-mobile-backhaul.result }}" == "success" && "${{ needs.build-olt-gpon.result }}" == "success" && "${{ needs.build-enterprise.result }}" == "success" && "${{ needs.build-residential.result }}" == "success" ]]; then
            echo "All jobs passed successfully!"
          else
            echo "Some jobs failed. Check logs above."
            exit 1
          fi
